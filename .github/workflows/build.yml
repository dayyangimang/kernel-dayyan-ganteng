# .github/workflows/build.yml
name: Build kernel
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu‑22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld device-tree-compiler \
                                   gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu \
                                   python3 python3-pip python3-setuptools \
                                   python3-yaml git wget curl zip unzip

      - name: Prepare source
        run: |
          # Ensure defconfig exists
          make vendor/ginkgo-perf_defconfig

          # Disable problematic options that cause build failures on Ubuntu‑22.04
          scripts/config --disable CONFIG_MMC_CQHCI
          scripts/config --disable CONFIG_MMC_CQHCI_CRYPTO
          scripts/config --disable CONFIG_MMC_CQHCI_MMC
          scripts/config --disable CONFIG_MMC_QCOM_DML
          scripts/config --disable CONFIG_MSM_CAMERA
          scripts/config --disable CONFIG_MSM_CAMERA_PLATFORM
          scripts/config --disable CONFIG_MSM_CAMERA_CCI
          scripts/config --disable CONFIG_MSM_CAMERA_V4L2
          scripts/config --disable CONFIG_MSM_GAZELLE
          scripts/config --disable CONFIG_MSM_GAZELLE_PLATFORM
          # Turn off treating warnings as errors
          scripts/config --disable CONFIG_WERROR

          # Disable module signing (already done earlier but keep for safety)
          scripts/config --disable CONFIG_MODULE_SIG
          scripts/config --disable CONFIG_MODULE_SIG_ALL
          scripts/config --disable CONFIG_MODULE_SIG_FORCE

          # Disable LTO and LLVM Polly (already done, keep)
          scripts/config --disable CONFIG_LTO_CLANG
          scripts/config --disable CONFIG_LLVM_POLLY

          # Apply any remaining default values
          make olddefconfig

      - name: Build kernel
        env:
          LD: ld.lld          # force clang’s LLD linker
        run: |
          make -j$(nproc) LD=ld.lld Image.gz-dtb dtbs

      - name: Package AnyKernel3
        run: |
          wget -q https://github.com/osm0sis/AnyKernel3/releases/download/v1/anykernel3.zip
          unzip -q anykernel3.zip -d anykernel3
          cp -r arch/arm64/boot/Image.gz-dtb anykernel3/
          cp -r arch/arm64/boot/dts/qcom/*.dtb anykernel3/
          # Inject user‑provided DTBO (67 Hz)
          cp ${{ github.workspace }}/67hz-dtbo.img anykernel3/dtbo.img
          cd anykernel3 && zip -r ../kernel-build.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: kernel-build
          path: kernel-build.zip
