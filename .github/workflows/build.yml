name: Build kernel
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld device-tree-compiler \
                                   gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu \
                                   python3 python3-pip python3-setuptools \
                                   python3-yaml git wget curl zip unzip

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b arrow-13.0 https://github.com/ArrowOS-Devices/android_kernel_xiaomi_ginkgo kernel

      - name: Prepare source
        working-directory: kernel
        run: |
          # Fix broken upstream include: angle brackets omit current source dir.
          sed -i 's|#include <../base/base.h>|#include "../base/base.h"|' drivers/thermal/thermal_core.c
          # Disable techpack/ subsystem (line 603) — not gated by Kconfig
          sed -i 's|^drivers-y.*:= drivers/ sound/ firmware/ techpack/$|drivers-y	:= drivers/ sound/ firmware/|' Makefile
          # MSM_DRM is disabled below; exclude only the Novatek driver that requires it.
          sed -i '/nt36xxx_spi_c3j/s/^/#/' drivers/input/touchscreen/Makefile
          if grep -qE '^[[:space:]]*obj-.*nt36xxx_spi_c3j' drivers/input/touchscreen/Makefile; then
            echo "Failed to disable nt36xxx_spi_c3j"
            exit 1
          fi
          grep -n 'nt36xxx_spi_c3j\|ft8719_spi_c3j' drivers/input/touchscreen/Makefile
          # Old vendor makefiles force -Werror; GCC 11 finds legacy warnings.
          # Use word-boundary sed to avoid mangling -Werror-implicit-function-declaration into broken flag
          find . -type f \( -name Makefile -o -name Kbuild \) -exec sed -i \
            -e 's/-Werror-implicit-function-declaration/-Wimplicit-function-declaration/g' \
            -e 's/-Werror[[:space:]]/ /g' \
            -e 's/-Werror$//g' {} +
          make ARCH=arm64 vendor/ginkgo-perf_defconfig
          scripts/config --disable CONFIG_WERROR
          scripts/config --disable CONFIG_DEBUG_INFO
          scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          scripts/config --disable CONFIG_LTO_CLANG
          scripts/config --disable CONFIG_THINLTO
          scripts/config --disable CONFIG_LLVM_POLLY
          scripts/config --disable CONFIG_MEDIA_SUPPORT
          scripts/config --disable CONFIG_MSM_CAMERA
          scripts/config --disable CONFIG_DRM_MSM
          scripts/config --disable CONFIG_SOUND
          scripts/config --disable CONFIG_SND
          scripts/config --disable CONFIG_SND_SOC
          scripts/config --disable CONFIG_TOUCHSCREEN_NT36xxx_HOSTDL_SPI_C3J
          scripts/config --disable CONFIG_TOUCHSCREEN_NT36XXX_SPI
          scripts/config --disable CONFIG_TOUCHSCREEN_NT36XXX_I2C
          # Accept defaults for any newer Kconfig symbols without interactive prompts.
          make ARCH=arm64 olddefconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          make -j$(nproc) \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS=-Wno-error \
            Image.gz-dtb dtbs

      - name: Package AnyKernel3
        run: |
          wget -q https://github.com/osm0sis/AnyKernel3/releases/download/v1/anykernel3.zip
          unzip -q anykernel3.zip -d anykernel3
          cp kernel/arch/arm64/boot/Image.gz-dtb anykernel3/
          cp kernel/arch/arm64/boot/dts/qcom/*.dtb anykernel3/ || true
          cp 67hz-dtbo.img anykernel3/dtbo.img || echo "DTBO file tidak ditemukan"
          cd anykernel3 && zip -r ../kernel-build.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: kernel-build.zip
