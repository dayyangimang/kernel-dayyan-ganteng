name: Build ginkgo test kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libncurses5-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            clang llvm libelf-dev device-tree-compiler zip unzip cpio rsync

      - name: Clone ArrowOS ginkgo kernel (arrow-13.0)
        run: |
          git clone --depth 1 -b arrow-13.0 \
            https://github.com/ArrowOS-Devices/android_kernel_xiaomi_ginkgo.git kernel_ginkgo

      - name: Build kernel
        working-directory: kernel_ginkgo
        env:
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabihf-
        run: |
          make vendor/ginkgo-perf_defconfig
          scripts/config --set-val LITTLE_CPU_MASK 15
          make olddefconfig
          make -j$(nproc) Image.gz-dtb dtbs
          ls -la arch/arm64/boot/

      - name: Prepare AnyKernel3 (Void KSun)
        run: |
          mkdir -p anykernel3
          cd anykernel3
          if [ -f ../void-ksun-v26.1-ginkgo-20260828-1630.zip ]; then
            echo "Extracting Void KSun AnyKernel3..."
            unzip -o ../void-ksun-v26.1-ginkgo-20260828-1630.zip \
              anykernel.sh tools/ak3-core.sh tools/busybox tools/magiskboot tools/magiskpolicy \
              -d . || echo "unzip failed, using fallback"
          else
            echo "Void KSun zip NOT FOUND in repo root!"
            ls -la ../
          fi
          if [ ! -f anykernel.sh ]; then
            echo "Using osm0sis AnyKernel3 fallback..."
            rm -rf /tmp/ak3 && git clone --depth 1 https://github.com/osm0sis/AnyKernel3 /tmp/ak3
            cp -r /tmp/ak3/* . 2>/dev/null || true
            rm -rf .git
          fi
          cp ../kernel_ginkgo/arch/arm64/boot/Image.gz-dtb .
          ls -la

      - name: Package flashable ZIP
        run: |
          cd anykernel3
          sed -i 's/device.name1=.*/device.name1=ginkgo/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=willow/' anykernel.sh
          sed -i 's/supported.versions=.*/supported.versions=10.0-16.0/' anykernel.sh
          zip -r9 ../ginkgo-test-kernel.zip . -x "*.git*" "*.md" "README*" "LICENSE"
          ls -la ../ginkgo-test-kernel.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ginkgo-test-kernel
          path: ginkgo-test-kernel.zip
